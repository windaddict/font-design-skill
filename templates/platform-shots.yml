name: platform-shots

# WHAT IT'S FOR: shows how a site's custom font is drawn by Chrome and Firefox on Windows, macOS and Linux, so
# the review can look at the smallest rows on the renderers the author's Mac does not have (DirectWrite on
# Windows above all). This file is a short caller: the legs and the comparison live in the skill's reusable
# workflow (.github/workflows/platform-shots-reusable.yml in windaddict/font-design-skill), and the site keeps
# no copy of the skill's scripts. Copy this file to <site>/.github/workflows/platform-shots.yml, replace FACE
# and the paths in `with:` below, pin the SHA, and start it by hand (Actions tab, or
# `gh workflow run platform-shots.yml`; then `gh run download <run id> -n platform-shots-compare`).
#
# WHAT IT PROVES, exactly: the skill's references/review-loop.md section 9 states it; in short, what the
# recorded browser drew on a GitHub-hosted virtual machine of the recorded OS, at the recorded scale and
# font-smoothing settings, with the served-200, sentinel, element and italic proofs of every shoot.py shot,
# using the skill's scripts at the commit pinned below (each leg's log names it). Nothing about a reader's
# machine, Edge, Safari or phones. Not a merge gate: it runs only when started by hand.
#
# COST (GitHub's billing pages, read 2026-11-17; re-check before relying on it): billed to this repository,
# not to the skill's. Free for standard runners in a public repository. In a private one each job is billed
# per started minute, rounded up, at Linux $0.006, Windows $0.010 and macOS $0.062 a minute, against $12 of
# included usage a month on GitHub Free ($18 on Pro and Team). Estimated, not measured: six legs plus the
# compare job about $0.40; a dispatch with browsers "chrome" about $0.24, because a leg left out by browsers or
# oses still starts its runner for about a minute. Artifacts: one per leg plus the comparison, kept 14 days,
# counted against the plan's artifact storage.
#
# PIN: replace the forty zeros with the full SHA of the skill commit you read (git -C <skill dir> rev-parse
# HEAD). Never a tag or a branch: the skill's workflow and scripts run with this repository's token. Bump it on
# purpose, after reading the skill's CHANGELOG. The zeros fail a dispatch at GitHub before any job starts.
#
# THE FIRST RUN: `workflow_dispatch` lists a workflow only once this file is on the repository's default
# branch; push it there before the first run. Your Actions settings must allow actions and reusable workflows
# (a "selected actions" policy must list windaddict/font-design-skill/.github/workflows/*).
#
# GITHUB ENTERPRISE SERVER is not supported: it has no job.workflow_* context, and the reusable workflow
# refuses to run without job.workflow_sha.
#
# A POLICY THAT FORBIDS PUBLIC REUSABLE WORKFLOWS (github.com only): copy platform-shots-reusable.yml into this
# repository, replace its `fd` checkout with a copy of the skill's scripts/ and requirements-platform.txt and
# delete its guard and verify steps (they check the checkout you removed), and call it with `uses: ./`. You
# then maintain that copy; the skill does not.
#
# THE INPUTS (`with:`, below; the reusable workflow's header defines each). Lists are separated by spaces or
# newlines; the family is one value and may contain spaces. `build` is committed here and not a dispatch input:
# it is run with `eval` in this repository's checkout, empty when the served root is committed. Each dispatch
# input below, when given, overrides the committed value for that run (a test of a broken font URL, one browser).

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "pages to shoot, space-separated (default: the committed list)"
        required: false
        default: ""
      scales:
        description: "device scales, space-separated (default: the committed list)"
        required: false
        default: ""
      font_urls:
        description: "root-relative woff2 paths, space-separated (default: the committed list)"
        required: false
        default: ""
      family:
        description: "the font family each shot must prove (default: the committed one)"
        required: false
        default: ""
      browsers:
        description: "browsers to run: chrome, firefox or both"
        required: false
        default: "chrome firefox"
      oses:
        description: "runner labels to run, space-separated"
        required: false
        default: "windows-latest macos-latest ubuntu-latest"

permissions:
  contents: read

jobs:
  shots:
    uses: windaddict/font-design-skill/.github/workflows/platform-shots-reusable.yml@0000000000000000000000000000000000000000
    with:
      serve: static-pages
      build: "" # commands that build or stage `serve` on the runner; empty when it is committed
      family: ${{ inputs.family || 'FACE' }}
      font_urls: ${{ inputs.font_urls || '/fonts/FACE-VF.woff2' }}
      pages: ${{ inputs.pages || 'index.html' }}
      font_json: tools/FACE/font.json # empty for a font the skill did not build
      scales: ${{ inputs.scales || '1 1.25' }}
      browsers: ${{ inputs.browsers }}
      oses: ${{ inputs.oses }}
