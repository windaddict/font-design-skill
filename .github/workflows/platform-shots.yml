name: platform-shots

# WHAT IT'S FOR: the release proof that the cross-platform rendering shots work. It calls the reusable workflow
# (.github/workflows/platform-shots-reusable.yml) at this same commit (`uses: ./`, which GitHub resolves to the
# caller's own commit), with the neutral fixture's inputs: Sampler wired into tests/fixtures/site-sample, as
# smoke.sh step 11 wires it. So a pull request that changes the tools runs its own scripts on Windows, macOS
# and Linux in Chrome and in Playwright's Firefox before merge, and compare-shots.py compares the legs. Here the
# caller's checkout (site/) and the skill's (fd/) are the same repository at the same commit. run_tool_tests
# adds a per-leg pytest step that runs the shoot.py tests for the Windows teardown, fractional scales, the meta
# file and the rows natively on each runner (plan F010), which nothing else executes on Windows.
#
# WHAT IT PROVES: that the tool runs and its proofs pass on each GitHub-hosted image in each browser; the
# Sampler PNGs are a fixture's, so what they show is about the tool working, not about a face. It proves
# nothing about a reader's machine (references/review-loop.md section 9 states the exact guarantee).
# COST: free (standard runners on a public repository, GitHub's billing page read 2026-11-17).
# TRIGGERS: by hand, and on a pull request that changes the tool, the workflows or the template
# (workflow_dispatch needs the file on the default branch for a first run). Never on push. Not a merge gate.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/shoot.py
      - scripts/shoot_playwright.py
      - scripts/specimen.py
      - scripts/specimen.html.tmpl
      - scripts/compare-shots.py
      - templates/platform-shots.yml
      - requirements-platform.txt
      - tests/test_shoot.py
      - tests/test_shoot_playwright.py
      - .github/workflows/platform-shots.yml
      - .github/workflows/platform-shots-reusable.yml

permissions:
  contents: read

jobs:
  neutral:
    uses: ./.github/workflows/platform-shots-reusable.yml
    with:
      serve: out/platform/site
      # Run in the site/ checkout. The last two lines copy the built Sampler files into the fd/ checkout too,
      # because the tool tests run there and the specimen test among them skips without examples/neutral/out.
      build: |
        python -m pip install -r requirements.txt
        python scripts/build.py --font examples/neutral/font.json
        mkdir -p out/platform/site/fonts
        cp -R tests/fixtures/site-sample/. out/platform/site/
        cp examples/neutral/out/Sampler-VF.woff2 examples/neutral/out/Sampler-Italic-VF.woff2 out/platform/site/fonts/
        cat >> out/platform/site/css/site.css <<'CSS'
        @font-face { font-family: 'Sampler'; src: url('/fonts/Sampler-VF.woff2') format('woff2'); font-weight: 400 700; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Sampler'; src: url('/fonts/Sampler-Italic-VF.woff2') format('woff2'); font-weight: 400 700; font-style: italic; font-display: swap; }
        h1, h2, h3, .plate-title, .frontis-title, .wordmark { font-family: 'Sampler', Georgia, serif; font-optical-sizing: auto; }
        CSS
        mkdir -p ../fd/examples/neutral/out
        cp examples/neutral/out/Sampler-VF.woff2 examples/neutral/out/Sampler-Italic-VF.woff2 ../fd/examples/neutral/out/
      family: Sampler
      font_urls: |
        /fonts/Sampler-VF.woff2
        /fonts/Sampler-Italic-VF.woff2
      # essay.html is left out on purpose: it carries Å and Ž, which Sampler lacks, so every leg would refuse it.
      pages: index.html
      font_json: examples/neutral/font.json
      run_tool_tests: true
