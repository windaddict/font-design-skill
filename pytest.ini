[pytest]
# A bare `pytest` at the repo root collects only the repo's own tests. scripts/tests/ is the font-suite
# TEMPLATE a project copies beside its font.json: its conftest demands --font and --requirements, and
# collecting both folders at once loads two modules named `conftest`, so each test file's
# `from conftest import ...` resolves to the wrong one. Run the template on the fixture by path:
#   .venv/bin/python3 -m pytest scripts/tests/test_font.py -q --font examples/neutral/font.json --requirements examples/neutral/requirements.json
testpaths = tests
