<!-- fd-round: round1 -->
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headline concepts, round 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- WHAT IT'S FOR: round 1 of the concept pipeline, the spectrum. Every concept in concepts.js is
     drawn by the generator on the site's own surfaces at the sizes the site uses: an optional audit
     list, the guidelines, an "all N side by side" lineup with a text box and a weight select, one full
     specimen per concept (wordmark in capitals, a fitted large title, a section heading, chapter rows,
     an essay title with a paragraph, a tile grid at the small title size, a character row), the
     comparison face on the same lineup, and a recommendation footer. All copy, colours and titles come
     from the content JSON in the fd-content block; scripts/concepts/build-page.js splices gen.js,
     render.js and concepts.js at the three markers in the script below and validates the content.

     Every element is made with createElement, textContent and setAttribute; no string is ever
     parsed as markup, so a hostile title stays text. Colours are CSS variables set from
     content.colours with style.setProperty. Specs are drawn only after the whole page is in the
     document, because render() wraps to the element's measured width (an earlier version measured
     before attachment and clipped every title).

     ?face=<concept id> moves that concept's specimen first and marks it (data-fd-face); ?text=...
     sets the lineup text. After drawing, <html> carries data-fd-round, data-fd-face, data-fd-rendered
     (glyphs drawn by render()) and data-fd-font (the comparison face: loaded / missing / none) for
     the smoke run's dumped DOM.

     The tile grid: repeat(auto-fill, minmax(10.5rem, 1fr)) with a 1rem gap in a 72rem column gives
     floor((468+16)/184) = 2 columns at 500px (16px gutters) and floor((1152+16)/184) = 6 at 1280 and
     1600px, so a tile count that is a multiple of 6 fills every row at those three widths; the
     builder enforces it. Between 720 and 1087px (4 and 5 columns) the last row can be short.
     Copyright 2026 John Knox. MIT licence. From the Bract round-1 page (2026-11-15), neutralised. -->
<style>
:root {
  color-scheme: light;
  --cloth: #1d2a3a; --cloth-ink: #f1ebdd; --stamp: #c9c0a8;
  --paper: #f4efe6; --plate: #fdfaf5; --ink: #22201c; --pencil: #6b655c;
  --accent: #2d6a7a; --rule: rgba(34, 32, 28, .16); --placeholder: #9aa5ad;
  --body: Georgia, serif;
  --label: system-ui, sans-serif;
  --compare: serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.08rem; line-height: 1.55; }
.col { max-width: 72rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.prose { max-width: 40rem; display: grid; gap: .8rem; }
h1, h2, h3 { font-family: var(--body); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4vw, 2.8rem); }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
a { color: var(--accent); }
code { font-size: .92em; }
.meta { font-family: var(--label); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--pencil); }
header.top { padding-block: 3rem 2rem; display: grid; gap: 1rem; }
section.part { padding-block: 2.5rem; border-top: 1px solid var(--rule); display: grid; gap: 1.2rem; }

/* audit */
.audit { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.1rem; counter-reset: a; }
.audit li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: .2rem 1rem; counter-increment: a; }
.audit li::before { content: counter(a); font-family: var(--label); font-size: .8rem; color: var(--accent); padding-top: .25rem; font-variant-numeric: tabular-nums; }
.audit li > div { display: grid; gap: .25rem; min-width: 0; }
.audit .fix { color: var(--ink); }
.audit .font { color: var(--pencil); font-size: .95rem; }
.audit .first { font-family: var(--label); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.guides { margin: 0; padding-left: 1.2rem; display: grid; gap: .5rem; max-width: 44rem; }

/* lineup */
.controls { display: flex; flex-wrap: wrap; gap: .8rem 1.2rem; align-items: end; }
.controls label { display: grid; gap: .3rem; font-family: var(--label); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--pencil); }
.controls .grow { flex: 1 1 18rem; }
.controls input[type=text], .controls select { font: inherit; font-family: var(--body); font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--plate); border: 1px solid var(--rule); padding: .45rem .6rem; width: 100%; }
.controls input:focus-visible, .controls select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lineup { display: grid; gap: .3rem; }
.lineup-row { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 1rem; align-items: center; padding-block: .6rem; border-bottom: 1px solid var(--rule); }
.lineup-row .who { display: grid; gap: .1rem; }
.lineup-row .who b { font-weight: 600; }
.lineup-row .who span { font-size: .85rem; color: var(--pencil); line-height: 1.3; }
@media (max-width: 560px) { .lineup-row { grid-template-columns: 1fr; gap: .3rem; } }

/* rendered type */
.r { min-width: 0; overflow: hidden; }
.r svg { display: block; }
.css-face { font-family: var(--compare); line-height: 1.12; text-wrap: balance; font-synthesis: none; }

/* concept */
.concept { display: grid; gap: 1.4rem; }
.concept.is-selected { outline: 2px solid var(--accent); outline-offset: 12px; }
.concept-head { display: grid; gap: .5rem; max-width: 46rem; }
.concept-head h2 { display: flex; flex-wrap: wrap; gap: .3rem .8rem; align-items: baseline; }
.pick { font-family: var(--label); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .25rem 1rem; font-size: .95rem; margin: 0; }
.facts dt { color: var(--pencil); }
.facts dd { margin: 0; }
.frontis { background: var(--cloth); color: var(--cloth-ink); border-bottom: 3px solid var(--accent); padding: 1.4rem clamp(1rem, 3vw, 2.2rem) 1.8rem; display: grid; gap: 1.1rem; }
.frontis .wm { color: var(--stamp); }
.frontis .lede { opacity: .86; max-width: 28rem; font-size: 1.02rem; }
.frontis .plateline { font-family: var(--label); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
.sheet { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; }
@media (max-width: 760px) { .sheet { grid-template-columns: 1fr; } }
.sheet > div { display: grid; gap: .7rem; align-content: start; min-width: 0; }
.chapters { display: grid; gap: .55rem; }
.chap { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); align-items: baseline; gap: .6rem; }
.chap .num { color: var(--accent); }
.chap .blurb { grid-column: 2; font-size: .9rem; color: var(--pencil); margin-top: -.2rem; }
.essay { max-width: 500px; display: grid; gap: .6rem; }
.essay .date { color: var(--pencil); font-size: .95rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 1.4rem 1rem; }
.tile { display: grid; gap: .35rem; align-content: start; min-width: 0; }
.tile .ph { aspect-ratio: 4 / 3; max-width: 100%; background: var(--placeholder); }
.tile .d { font-size: .85rem; color: var(--pencil); font-variant-numeric: tabular-nums; }
.note { font-size: .9rem; color: var(--pencil); max-width: 44rem; }
.chars { color: var(--ink); }
footer { padding-block: 2.5rem 4rem; border-top: 1px solid var(--rule); }
</style>

<div class="col">
<header class="top">
  <p class="meta" id="kicker"></p>
  <h1 id="title"></h1>
  <div class="prose" id="intro"></div>
</header>
<section class="part" id="audit-part" hidden>
  <h2>Fix the page before drawing the font</h2>
  <p class="prose" id="audit-intro"></p>
  <ol class="audit" id="audit"></ol>
</section>
<section class="part">
  <h2>What every concept has to do</h2>
  <ul class="guides" id="guides"></ul>
</section>
<section class="part">
  <h2 id="lineup-title"></h2>
  <div class="controls">
    <label class="grow" for="headline-text">Headline to set
      <input type="text" id="headline-text"></label>
    <label for="lineup-weight">Weight
      <select id="lineup-weight"></select></label>
  </div>
  <div class="lineup" id="lineup"></div>
</section>
<div id="concepts"></div>
<footer>
  <div class="prose" id="recommendation"></div>
</footer>
</div>

<script type="application/json" id="fd-content">/*CONTENT*/</script>
<script>
// a script error must be visible to the smoke run: it lands on <html> as data-fd-error
window.addEventListener("error", function (e) { document.documentElement.setAttribute("data-fd-error", String(e.message || e)); });
(function () {
/*GEN*/
/*CONCEPTS*/
/*RENDER*/

var CONTENT = JSON.parse(document.getElementById("fd-content").textContent);
var QUERY = new URLSearchParams(location.search);
var ROOT = document.documentElement;
var COMPARISON = "comparison";

// ---- DOM helpers: text only, never markup ----
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
function add(parent, tag, cls, text) { var e = el(tag, cls, text); parent.appendChild(e); return e; }
function cssString(s) { return "\"" + String(s).replace(/\\/g, "\\\\").replace(/"/g, "\\\"").replace(/\n/g, " ") + "\""; }
function fdConcept(id) { for (var i = 0; i < CONCEPTS.length; i++) if (CONCEPTS[i].id === id) return CONCEPTS[i]; return null; }

// ---- colours and fonts from content, as CSS variables ----
Object.keys(CONTENT.colours).forEach(function (k) { ROOT.style.setProperty("--" + k, CONTENT.colours[k]); });
ROOT.style.setProperty("--body", CONTENT.fonts.body);
ROOT.style.setProperty("--label", CONTENT.fonts.label);

// ---- the comparison face: a local woff2 beside the page, or a stylesheet URL; serif when missing ----
var CMP = CONTENT.comparison;
ROOT.style.setProperty("--compare", cssString(CMP.family) + ", serif");
if (CMP.font_url) {
  var ws = CMP.weights && CMP.weights.length ? CMP.weights : [400, 700];
  var st = document.createElement("style");
  st.textContent = "@font-face { font-family: " + cssString(CMP.family) + "; font-weight: " + Math.min.apply(null, ws) + " " + Math.max.apply(null, ws) +
    "; src: url(" + cssString(CMP.font_url) + ") format(\"woff2\"); }";
  document.head.appendChild(st);
} else if (CMP.css_url) {
  var lk = document.createElement("link"); lk.setAttribute("rel", "stylesheet"); lk.setAttribute("href", CMP.css_url);
  document.head.appendChild(lk);
}

// ---- page frame ----
$("kicker").textContent = CONTENT.site.kicker + " · round 1";
$("title").textContent = CONTENT.round.title;
document.title = CONTENT.round.title;
CONTENT.round.intro.forEach(function (p) { add($("intro"), "p", "", p); });

if (CONTENT.audit && CONTENT.audit.length) {
  $("audit-part").hidden = false;
  $("audit-intro").textContent = CONTENT.audit_intro || "";
  CONTENT.audit.forEach(function (a) {
    var li = add($("audit"), "li"), d = add(li, "div");
    if (a.first) add(d, "span", "first", "Do first");
    add(d, "b", "", a.finding);
    add(d, "span", "fix", a.fix);
    add(d, "span", "font", "For the font: " + a.font_effect);
  });
}
CONTENT.guidelines.forEach(function (g) {
  var li = add($("guides"), "li");
  add(li, "b", "", g.lead); li.appendChild(document.createTextNode(" " + g.text));
});

// ---- specs: a box is drawn later, after layout, through the generator or in the comparison face ----
var specs = [], counts = [];
function spec(box, o) { o.el = box; specs.push(o); return box; }
function box(parent, cls) { var b = el("div", "r" + (cls ? " " + cls : "")); parent.appendChild(b); return b; }
function draw(o, i) {
  var text = typeof o.text === "function" ? o.text() : o.text;
  var w = typeof o.weight === "function" ? o.weight() : (o.weight || 1);
  var size = typeof o.size === "function" ? o.size(o.el.clientWidth || 300) : o.size;
  if (o.concept === COMPARISON) {
    var d = el("div", "css-face", o.caps ? String(text).toUpperCase() : text);
    d.style.fontSize = size + "px"; d.style.fontWeight = w >= CONTENT.bold_mult ? "700" : w > 1 ? "500" : "400";
    if (o.caps) d.style.letterSpacing = ".06em";
    while (o.el.firstChild) o.el.removeChild(o.el.firstChild);
    o.el.appendChild(d);
    counts[i] = 0;
    return;
  }
  var c = fdConcept(o.concept);
  if (!c) { counts[i] = 0; return; }
  if (o.caps) c = Object.assign({}, c, { id: c.id + "-caps", track: (c.track || 0) + 60 });
  counts[i] = render(o.el, o.caps ? String(text).toUpperCase() : text, params(c, w, false), size, { kern: !o.caps, liga: true, lh: o.lh });
}
function redraw(f) {
  specs.forEach(function (o, i) { if (!f || f(o)) draw(o, i); });
  var sum = 0; counts.forEach(function (n) { sum += n || 0; });
  ROOT.setAttribute("data-fd-rendered", String(sum));
}

// ---- lineup ----
var BOLD = CONTENT.bold_mult;
var wsel = $("lineup-weight");
CONTENT.weights.forEach(function (w) { var opt = add(wsel, "option", "", w.label); opt.value = String(w.mult); });
$("headline-text").value = QUERY.get("text") || CONTENT.lineup_text;
var ROWS = CONCEPTS.map(function (c) { return { id: c.id, name: c.name, from: c.from || "" }; })
  .concat([{ id: COMPARISON, name: CMP.name, from: CMP.note || "For comparison" }]);
$("lineup-title").textContent = "All " + CONCEPTS.length + " side by side";
ROWS.forEach(function (r) {
  var row = add($("lineup"), "div", "lineup-row"), who = add(row, "div", "who");
  add(who, "b", "", r.name); add(who, "span", "", r.from);
  spec(box(row), { concept: r.id, group: "lineup",
    text: function () { return $("headline-text").value.trim() || CONTENT.lineup_text; },
    weight: function () { return parseFloat(wsel.value); },
    size: function (w) { return Math.max(26, Math.min(44, w / 14)); } });
});

// ---- one full specimen per concept, the comparison face last; ?face= puts one concept first ----
var SP = CONTENT.specimen, wanted = QUERY.get("face");
var order = ROWS.slice(0, -1);
if (wanted && fdConcept(wanted)) order = order.filter(function (r) { return r.id === wanted; }).concat(order.filter(function (r) { return r.id !== wanted; }));
order.concat([ROWS[ROWS.length - 1]]).forEach(function (r) {
  var id = r.id, info = (CONTENT.concepts || {})[id];
  var sec = el("section", "part concept" + (id === wanted ? " is-selected" : ""));
  sec.id = "concept-" + id;
  var head = add(sec, "div", "concept-head"), h2 = add(head, "h2", "", r.name);
  if (info && info.pick) add(h2, "span", "pick", "Shortlist");
  if (info) {
    add(head, "p", "", info.desc);
    var dl = add(head, "dl", "facts");
    [["Source", r.from], ["Build cost", info.cost], ["Risk", info.risk]].forEach(function (f) { add(dl, "dt", "", f[0]); add(dl, "dd", "", f[1]); });
  } else if (id === COMPARISON) {
    add(head, "p", "", CMP.note || "The comparison face on the same specimens.");
  }
  var fr = add(sec, "div", "frontis");
  spec(box(fr, "wm"), { concept: id, text: CONTENT.site.wordmark, caps: true, weight: BOLD, size: 26 });
  spec(box(fr), { concept: id, text: CONTENT.site.wordmark, size: function (w) { return Math.max(46, Math.min(80, w / 7)); } });
  add(fr, "p", "lede", CONTENT.site.lede);
  add(fr, "p", "plateline", SP.plateline);

  var sh = add(sec, "div", "sheet"), left = add(sh, "div");
  spec(box(left), { concept: id, text: SP.heading, weight: BOLD, size: function (w) { return Math.max(26, Math.min(35, w / 9)); } });
  var ch = add(left, "div", "chapters");
  SP.chapters.forEach(function (c) {
    var row = add(ch, "div", "chap");
    spec(box(row, "num"), { concept: id, text: c.num, size: 15.2 });
    spec(box(row), { concept: id, text: c.name, weight: BOLD, size: 19 });
    if (c.blurb) add(row, "p", "blurb", c.blurb);
  });
  var right = add(sh, "div", "essay");
  spec(box(right), { concept: id, text: SP.essay.title, size: function (w) { return Math.max(30, Math.min(44, w / 11)); }, lh: 1150 });
  add(right, "p", "date", SP.essay.date);
  add(right, "p", "", SP.essay.paragraph);

  var g = add(sec, "div", "grid");
  SP.tiles.forEach(function (p) {
    var t = add(g, "div", "tile"), ph = add(t, "div", "ph");
    ph.style.background = p.colour;
    spec(box(t), { concept: id, text: p.title, size: 16.8, lh: 1250 });
    add(t, "p", "d", p.date);
  });
  if (SP.tiles_note) add(sec, "p", "note", SP.tiles_note);
  spec(box(sec, "chars"), { concept: id, text: SP.chars, size: function (w) { return Math.max(22, Math.min(30, w / 30)); } });
  $("concepts").appendChild(sec);
});

add($("recommendation"), "h2", "", CONTENT.recommendation.heading);
CONTENT.recommendation.paragraphs.forEach(function (p) { add($("recommendation"), "p", "", p); });

// ---- draw, then wire the controls ----
ROOT.setAttribute("data-fd-round", "round1");
ROOT.setAttribute("data-fd-face", wanted && fdConcept(wanted) ? wanted : "all");
ROOT.setAttribute("data-fd-font", "none");
redraw();
$("headline-text").addEventListener("input", function () { redraw(function (o) { return o.group === "lineup"; }); });
wsel.addEventListener("change", function () { redraw(function (o) { return o.group === "lineup"; }); });
var lastW = window.innerWidth, timer;
window.addEventListener("resize", function () {
  if (window.innerWidth === lastW) return;
  lastW = window.innerWidth; clearTimeout(timer); timer = setTimeout(function () { redraw(); }, 150);
});
// the comparison face: redraw it once its font is ready and record whether it really loaded
function probeComparison() {
  var probe = el("span", "", "Handgloves Hamburgefonstiv 0123456789");
  probe.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font-size:48px;font-weight:400";
  document.body.appendChild(probe);
  probe.style.fontFamily = "serif"; var wb = probe.getBoundingClientRect().width;
  probe.style.fontFamily = cssString(CMP.family) + ", serif"; var wf = probe.getBoundingClientRect().width;
  document.body.removeChild(probe);
  var checked = false;
  try { checked = document.fonts.check("16px " + cssString(CMP.family)); } catch (e) { checked = false; }
  return checked && wf !== wb ? "loaded" : "missing";
}
if (document.fonts && document.fonts.ready) {
  var want = document.fonts.load ? document.fonts.load("16px " + cssString(CMP.family)) : Promise.resolve();
  want.then(function () { return document.fonts.ready; }, function () { return document.fonts.ready; }).then(function () {
    ROOT.setAttribute("data-fd-font", probeComparison());
    redraw(function (o) { return o.concept === COMPARISON; });
  });
}
})();
</script>
